name: CI/CD Pipeline

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop", "master" ]

jobs:
  build_test_analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Run Tests
      run: mvn test
      
    - name: SonarQube Scan
      # mock simulation of sonarqube scan
      run: echo "mvn sonar:sonar -Dsonar.projectKey=ECI-SportLife"

  deploy:
    needs: build_test_analyze
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Azure (Mock)
      run: echo "Deploying to Azure DevOps..."
